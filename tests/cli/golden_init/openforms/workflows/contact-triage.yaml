slug: contact-triage
title: Contact triage
initial: new
states:
  - key: new
    label: New
    color: gray
  - key: in_progress
    label: In progress
    color: blue
  - key: resolved
    label: Resolved
    color: green
    terminal: true
  - key: spam
    label: Spam
    color: red
    terminal: true
fields:
  - key: resolution
    type: textarea
    label: Resolution notes
onSubmit:
  - type: assign
    role: support
transitions:
  - key: start
    label: Start working
    from:
      - new
    to: in_progress
    guard:
      roles:
        - support
  - key: resolve
    label: Resolve
    from:
      - in_progress
    to: resolved
    guard:
      roles:
        - support
      requireFields:
        - resolution
    actions:
      - type: email
        to: '{{submission.data.email}}'
        subject: 'Re: your message'
        body: Hi {{submission.data.name}}, {{submission.fields.resolution}}
  - key: mark_spam
    label: Mark as spam
    from:
      - new
      - in_progress
    to: spam
    guard:
      roles:
        - support
