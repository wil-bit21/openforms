[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openforms"
version = "0.1.0"
description = "Self-hosted, developer-first forms with per-form submission workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.13,<2",
    "anyio>=4.4,<5",
    "asyncpg>=0.29,<1",
    "bcrypt>=4.1,<6",
    "cyclopts>=3.1,<5",
    "fastapi>=0.115,<1",
    "google-re2>=1.1.20251105",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0.1,<7",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
openforms = "openforms.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.hatch.build]
artifacts = ["src/openforms/server/ui"]

[tool.hatch.build.targets.sdist]
include = ["/src/openforms", "/schemas", "/examples/openforms", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/openforms"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "openforms/_schemas"
"examples/openforms" = "openforms/_examples"

[tool.hatch.build.targets.wheel.force-include-editable]
# editable installs read schemas/ and examples/ from the repo root (see openforms._paths)

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI commands are one-shot processes; blocking file I/O inside them is fine.
"src/openforms/cli/*" = ["ASYNC240"]
"tests/**" = ["ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfEs"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
